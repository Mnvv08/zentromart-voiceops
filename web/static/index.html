<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZentroMart Voice Support</title>
<style>
  :root { --bg:#f7f4ef; --card:#fff; --ink:#1f2933; --muted:#6b7280; --accent:#5b4bdb; --accent2:#ff8a4c; --line:#e7e2da; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:#fffdf9; }
  header h1 { font-size:18px; margin:0; } header span { color:var(--muted); font-size:13px; }
  main { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:calc(100vh - 64px); }
  #log { flex:1; overflow-y:auto; padding:8px 4px; }
  .msg { max-width:80%; padding:12px 14px; border-radius:14px; margin:8px 0; line-height:1.45; font-size:15px; }
  .user { background:#ece9ff; margin-left:auto; border-bottom-right-radius:4px; }
  .bot { background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; }
  .chip { display:inline-block; background:#f1efe9; border:1px solid var(--line); border-radius:999px; padding:2px 8px; margin:2px 4px 0 0; font-size:11px; cursor:help; }
  .tag { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; background:#fff1e8; color:#b4541a; margin-right:6px; }
  #controls { display:flex; gap:10px; align-items:center; padding:12px 0; }
  #mic { width:64px; height:64px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:26px; cursor:pointer; flex:none; box-shadow:0 4px 14px rgba(91,75,219,.35); }
  #mic.rec { background:#e0413a; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 12px rgba(224,65,58,.15);} }
  #txt { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--line); font-size:15px; background:#fff; }
  button.small { padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; }
  #status { font-size:13px; color:var(--muted); min-height:18px; }
</style>
</head>
<body>
<header><h1>ZentroMart support · voice agent</h1><span>Gnani STT → RAG agent → Gnani TTS</span></header>
<main>
  <div id="log"></div>
  <div id="status">Click the mic, speak, click again to send.</div>
  <div id="controls">
    <button id="mic" title="Record">🎙</button>
    <input id="txt" placeholder="…or type a message and press Enter">
    <button class="small" id="reset">New call</button>
  </div>
</main>
<script>
const log = document.getElementById('log'), statusEl = document.getElementById('status');
let sid = Math.random().toString(36).slice(2);
function add(role, text, extra) {
  const d = document.createElement('div'); d.className = 'msg ' + role;
  d.textContent = text;
  if (extra) d.appendChild(extra);
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function showReply(r) {
  if (r.heard) add('user', r.heard);
  const meta = document.createElement('div'); meta.className = 'meta';
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = r.decision; meta.appendChild(tag);
  (r.tools||[]).forEach(t => { const s=document.createElement('span'); s.className='chip'; s.textContent='🔧 '+t; meta.appendChild(s); });
  (r.sources||[]).forEach(s => { const c=document.createElement('span'); c.className='chip'; c.textContent=s.id; c.title=s.title+'\n\n'+s.text; meta.appendChild(c); });
  add('bot', r.reply, meta);
  if (r.audio) new Audio(r.audio).play();
}
// --- WAV recorder (16 kHz mono PCM, accepted by Gnani STT) ---
let ctx, proc, src, stream, chunks = [], recording = false;
async function start() {
  stream = await navigator.mediaDevices.getUserMedia({audio:true});
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  src = ctx.createMediaStreamSource(stream);
  proc = ctx.createScriptProcessor(4096, 1, 1);
  chunks = [];
  proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(proc); proc.connect(ctx.destination);
  recording = true; document.getElementById('mic').classList.add('rec'); statusEl.textContent = 'Listening… click to send';
}
function encodeWav(buffers, inRate) {
  const len = buffers.reduce((a,b)=>a+b.length,0), data = new Float32Array(len);
  let o=0; buffers.forEach(b=>{data.set(b,o); o+=b.length;});
  const outRate = 16000, ratio = inRate/outRate, n = Math.floor(len/ratio), pcm = new Int16Array(n);
  for (let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,data[Math.floor(i*ratio)])); pcm[i]=s<0?s*0x8000:s*0x7FFF; }
  const buf = new ArrayBuffer(44+pcm.length*2), v = new DataView(buf);
  const w=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i));};
  w(0,'RIFF'); v.setUint32(4,36+pcm.length*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,outRate,true); v.setUint32(28,outRate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm); return new Blob([buf],{type:'audio/wav'});
}
async function stop() {
  recording = false; document.getElementById('mic').classList.remove('rec');
  proc.disconnect(); src.disconnect(); stream.getTracks().forEach(t=>t.stop());
  const blob = encodeWav(chunks, ctx.sampleRate); ctx.close();
  statusEl.textContent = 'Thinking…';
  const fd = new FormData(); fd.append('audio', blob, 'turn.wav'); fd.append('sid', sid);
  try { const r = await (await fetch('/api/voice',{method:'POST',body:fd})).json(); showReply(r); statusEl.textContent=''; }
  catch(e) { statusEl.textContent = 'Error: '+e; }
}
document.getElementById('mic').onclick = () => recording ? stop() : start();
document.getElementById('txt').addEventListener('keydown', async e => {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  const text = e.target.value.trim(); e.target.value=''; statusEl.textContent='Thinking…';
  const r = await (await fetch('/api/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,sid})})).json();
  showReply(r); statusEl.textContent='';
});
document.getElementById('reset').onclick = async () => {
  await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid})});
  sid = Math.random().toString(36).slice(2); log.innerHTML=''; statusEl.textContent='New call started.';
};
</script>
</body>
</html>
